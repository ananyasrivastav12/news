repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files

-   repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
    -   id: black
        # This exclude rule is crucial. It tells pre-commit to never
        # run black on any files inside the .venv directory.
        exclude: ^backend/\.venv/

-   repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
    -   id: isort
        name: isort (python)
        exclude: ^backend/\.venv/

-   repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
    -   id: flake8
        args:
        -   --max-line-length=88
        -   --extend-ignore=E203,E501
        -   --per-file-ignores=backend/app/tasks/__init__.py:F401,backend/app/db/scripts/initial_data.py:E402,backend/scripts/check_openai_key.py:E402,backend/tests/test_frontend_contract.py:E402
        exclude: ^backend/\.venv/

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
    -   id: mypy
        exclude: ^backend/(\.venv/|alembic/|app/db/model\.py|app/api/endpoints/dev\.py|app/core/config\.py)
        # Mypy requires these additional dependencies to be specified
        additional_dependencies: [
            "sqlalchemy[asyncio]",
            "pydantic",
            "pydantic-settings",
            "passlib",
            "python-jose",
            "celery",
            "redis",
            "httpx"
        ]
