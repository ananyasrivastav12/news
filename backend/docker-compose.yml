version: '3.9'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: newsuser
      POSTGRES_PASSWORD: newspass
      POSTGRES_DB: newsdb
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 80 --reload
    depends_on:
      - db
      - redis
    ports:
      - "8000:80"
    env_file:
      - .env
    volumes:
      - .:/usr/src/app

  worker:
    build: .
    command: celery -A app.core.celery_app.celery worker --loglevel=info
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - .:/usr/src/app

volumes:
  pgdata: